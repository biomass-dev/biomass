repos:
  - repo: https://github.com/pycqa/isort
    rev: 10.0.0b2
    hooks:
      - id: isort
        additional_dependencies: [toml]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
        additional_dependencies: [toml]
        language_version: python3.12

  - repo: https://github.com/PyCQA/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
